# Lavalink v4 Configuration
# 2025년 YouTube 차단 대응 설정

server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube Source Plugin (필수) - 429 에러 방지용
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    # LavaSrc Plugin - Spotify, Apple Music, Deezer 지원
    # 4.3.0은 Spotify 익명 토큰(TOTP) 방식이 깨져 검색/URL 해석 불가 → 4.8.3로 상향.
    # 4.8.3은 신규 Spotify 앱용 playlist API(/items) 대응 포함. (Lavalink v4면 충분)
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    # SponsorBlock Plugin - 광고 구간 자동 스킵 (선택)
    - dependency: "com.github.topi314.sponsorblock:sponsorblock-plugin:3.0.1"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "youshallnotpass"
    sources:
      # 내장 소스 비활성화 (플러그인 사용)
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    # 버퍼 설정
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true

    # 플레이어 설정
    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 1000
    youtubeSearchEnabled: true
    gc-warnings: true

# YouTube Plugin 설정 (핵심!)
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # OAuth2 인증 설정 (429 에러 방지 핵심)
    # 서버에서 직접 OAuth 인증 후 refreshToken 설정 필요
    oauth:
      enabled: true
      # Lavalink 실행 시 환경변수 YOUTUBE_REFRESH_TOKEN 필요 (없으면 placeholder 로 둘 것)
      refreshToken: "${YOUTUBE_REFRESH_TOKEN}"

    # 클라이언트 설정 (2026-10: WEB은 SABR 전용이라 오디오 스트림 없음, ANDROID_*는 로그인 요구)
    # → 재생은 OAuth 지원 TV 클라이언트 + TVHTML5_SIMPLY에 의존. 순서대로 시도됨.
    clients:
      - MUSIC
      - WEB
      - TVHTML5_SIMPLY
      - TV
      - ANDROID_VR

    # 원격 서명 해독 서버 (musi_bot/yt-cipher/compose.yml, Docker localhost:8001)
    # 로컬 cipher가 YouTube 신규 플레이어 스크립트를 해석 못해 TV(OAuth) 재생이 실패하던 문제 해결.
    remoteCipher:
      url: "http://localhost:8001"
      userAgent: "musi_bot"

    # PoToken 설정 (선택 - 더 안정적인 연결)
    # pot:
    #   enabled: true
    #   token: "YOUR_POTOKEN_HERE"  # 필요시 설정

  # LavaSrc 설정 (Spotify 등 지원)
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: true

    # Spotify 설정 — 자격증명은 .env에서 주입 (start-lavalink.sh가 JVM 기동 전 source).
    # clientId/clientSecret가 비어 있으면 spsearch·URL 해석 모두 실패한다
    # (Spotify가 익명 토큰 방식을 막아 자격증명이 필수가 됨).
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "KR"          # 아티스트 인기곡 지역 필터 (ISO 3166-1 alpha-2)
      playlistLoadLimit: 10      # 페이지 단위 × 100곡 = 최대 1000곡
      albumLoadLimit: 6          # 페이지 단위 × 50곡 = 최대 300곡
      # 익명 토큰 서버(spotify-tokener, Docker localhost:8080) — 플레이리스트 해석에 필요.
      # Spotify가 플리 곡목록(/items)에 유저/익명 토큰을 요구하게 바뀌어(Client Credentials만으론
      # 401/404), 이 엔드포인트로 익명 토큰을 받아 플리(공식 37i9 포함)를 해석한다.
      # 서버 구동: musi_bot/spotify-tokener/compose.yml → docker compose up -d
      customTokenEndpoint: "http://localhost:8080/api/token"
      preferPartnerApi: true     # 플리 해석을 파트너 API(익명 토큰 경로)로 라우팅 (v1+Client Cred는 401)

  # SponsorBlock 설정
  sponsorblock:
    servers:
      - "https://sponsor.ajay.app"
    categories:
      - sponsor
      - selfpromo
      - interaction
      - intro
      - outro
      - music_offtopic

# 로깅 설정
logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: DEBUG

# 메트릭 (선택)
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
